network=signet
lnd-mode=integrated
disableui=true
lit-dir=/data/.lit
httpslisten=0.0.0.0:8443
enablerest=true

# litd's session-autopilot client dials an external Lightning Labs server and
# hard-fails startup on networks without a default server address.
autopilot.disable=true

# ---- sub-daemons ----
# The whole point of this lab. Production runs loop-mode=disable today.
loop-mode=integrated
faraday-mode=disable
pool-mode=disable
taproot-assets-mode=disable

# The thing AMB-3190 is here to prove. Loop defaults its data dir to ~/.loop,
# which in our pods is not on the PVC. The l402 token lives here and losing it
# strands static-address deposits until the 14,400 block timeout.
loop.loopdir=/data/.loop

# loop picks its server from the network (signet.swap.lightning.today:11010),
# so there is no server.host to set.

# ---- lnd ----
lnd.lnddir=/data/.lnd
lnd.alias=amboss-loop-lab
lnd.noseedbackup=true
lnd.rpclisten=0.0.0.0:10009
lnd.restlisten=0.0.0.0:8080
lnd.debuglevel=info,LOOP=debug,SADDR=debug

lnd.bitcoin.active=true
lnd.bitcoin.signet=true
lnd.bitcoin.node=bitcoind
lnd.bitcoind.rpchost=bitcoind:38332
lnd.bitcoind.rpcuser=lightning
lnd.bitcoind.rpcpass=lightning
lnd.bitcoind.zmqpubrawblock=tcp://bitcoind:28332
lnd.bitcoind.zmqpubrawtx=tcp://bitcoind:28333
